[project]
name = "etl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CPGRU", email = "pei19860202@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.25.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[project.scripts]
etl = "etl:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
